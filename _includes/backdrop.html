{%- comment -%}
  Ambient background: three slow-drifting colour fields plus a film-grain
  overlay. Purely decorative, fixed behind everything, never interactive.
{%- endcomment -%}
<div class="backdrop" aria-hidden="true">
  <span class="backdrop__blob backdrop__blob--a"></span>
  <span class="backdrop__blob backdrop__blob--b"></span>
  <span class="backdrop__blob backdrop__blob--c"></span>
  <span class="backdrop__grain"></span>
</div>
<div class="progress" data-progress aria-hidden="true"></div>
