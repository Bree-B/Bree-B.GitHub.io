<div class="lightbox" data-lightbox role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="lightbox__close" type="button" data-lightbox-close aria-label="Close image viewer">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="lightbox__nav lightbox__nav--prev" type="button" data-lightbox-prev aria-label="Previous image" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="lightbox__nav lightbox__nav--next" type="button" data-lightbox-next aria-label="Next image" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <figure style="margin:0;display:grid;place-items:center">
    <img data-lightbox-img src="" alt="">
    <figcaption class="lightbox__caption" data-lightbox-caption></figcaption>
  </figure>
</div>
