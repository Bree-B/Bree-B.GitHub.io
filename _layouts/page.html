---
layout: default
---
<div class="wrap">
  <section class="page-hero">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 data-reveal>{{ page.title }}</h1>
    {%- if page.lead %}<p class="lead" data-reveal style="--reveal-delay:90ms">{{ page.lead }}</p>{% endif %}
  </section>

  {{ content }}
</div>
